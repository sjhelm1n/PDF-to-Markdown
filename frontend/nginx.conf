server {
    listen 80;
    client_max_body_size ${PDF2MD_MAX_UPLOAD_REQUEST_BYTES};
    root /usr/share/nginx/html;
    index index.html;
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_request_buffering off;
    error_page 413 = @body_too_large;
    location @body_too_large {
        default_type application/json;
        return 413 '{"detail":"Request body exceeds the size limit."}';
    }
    location ~ ^/api/jobs/[^/]+/markdown$ {
        client_max_body_size ${PDF2MD_MAX_EDIT_REQUEST_BYTES};
        proxy_pass http://api:8000;
    }
    location /api/ { proxy_pass http://api:8000; }
    location / { try_files $uri $uri/ /index.html; }
}
