services:
  web:
    build: ./frontend
    ports:
      - "${PDF2MD_WEB_BIND:-0.0.0.0}:${PDF2MD_WEB_PORT:-8085}:80"
    environment:
      PDF2MD_MAX_UPLOAD_REQUEST_BYTES: "${PDF2MD_MAX_UPLOAD_REQUEST_BYTES:-105906176}"
      PDF2MD_MAX_EDIT_REQUEST_BYTES: "${PDF2MD_MAX_EDIT_REQUEST_BYTES:-25165824}"
    depends_on:
      - api
    restart: unless-stopped
  api:
    build: ./backend
    cpus: ${PDF2MD_API_CPUS:-4}
    mem_limit: ${PDF2MD_API_MEM_LIMIT:-16g}
    volumes:
      - pdf2md-data:/data
      - docling-model-cache:/root/.cache
    environment:
      APP_DATA: /data
      DOCLING_DEVICE: cpu
      DOCLING_NUM_THREADS: "${PDF2MD_DOCLING_THREADS:-4}"
      MAX_PDF_BYTES: "${MAX_PDF_BYTES:-104857600}"
      PDF2MD_MAX_PDF_PAGES: "${PDF2MD_MAX_PDF_PAGES:-25}"
      PDF2MD_MAX_UPLOAD_REQUEST_BYTES: "${PDF2MD_MAX_UPLOAD_REQUEST_BYTES:-105906176}"
      PDF2MD_MAX_EDIT_REQUEST_BYTES: "${PDF2MD_MAX_EDIT_REQUEST_BYTES:-25165824}"
      PDF2MD_MAX_PENDING_JOBS: "${PDF2MD_MAX_PENDING_JOBS:-2}"
      PDF2MD_MAX_STORAGE_BYTES: "${PDF2MD_MAX_STORAGE_BYTES:-2147483648}"
      PDF2MD_RETENTION_SECONDS: "${PDF2MD_RETENTION_SECONDS:-604800}"
      PDF2MD_CLEANUP_INTERVAL_SECONDS: "${PDF2MD_CLEANUP_INTERVAL_SECONDS:-60}"
    restart: unless-stopped
volumes:
  pdf2md-data:
  docling-model-cache:
